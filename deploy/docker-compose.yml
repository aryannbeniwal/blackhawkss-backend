# Single-VM stack for blackhawkss.in (Oracle Cloud Always-Free, Ampere A1, 2 OCPU / 12 GB).
# Usage: copy ../.env.example to ../.env, fill it, then `docker compose up -d --build`.
# Expected checkout layout on the VM:
#   ~/apps/blackhawkss-backend   (this repo)
#   ~/apps/blackhawkss-frontend  (Next.js repo)

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: ../.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-blackhawkss}
      POSTGRES_USER: ${POSTGRES_USER:-blackhawkss}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-blackhawkss} -d ${POSTGRES_DB:-blackhawkss}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1g
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=40"]

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-blackhawkss}
      DB_USER: ${POSTGRES_USER:-blackhawkss}
      DB_PASS: ${POSTGRES_PASSWORD}
      UPLOADS_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1g
    expose:
      - "8080"

  web:
    build:
      context: ../../blackhawkss-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://blackhawkss.in}
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      BACKEND_URL: http://api:8080
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://blackhawkss.in}
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 512m
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/blackhawkss.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads:/var/www/uploads:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - web
      - api
    deploy:
      resources:
        limits:
          memory: 128m

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    # Renews twice a day; first issuance is done manually (see README).
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"]

volumes:
  pgdata:
  uploads:
  letsencrypt:
  certbot-www:
