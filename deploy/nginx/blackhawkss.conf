# nginx reverse proxy for blackhawkss.in
# Before the first certificate exists, temporarily comment out the 443 block and run certbot (see README).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream web_upstream { server web:3000; }
upstream api_upstream { server api:8080; }

server {
    listen 80;
    listen [::]:80;
    server_name blackhawkss.in www.blackhawkss.in;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://blackhawkss.in$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.blackhawkss.in;
    ssl_certificate     /etc/letsencrypt/live/blackhawkss.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blackhawkss.in/privkey.pem;
    return 301 https://blackhawkss.in$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name blackhawkss.in;

    ssl_certificate     /etc/letsencrypt/live/blackhawkss.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blackhawkss.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 15m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Uploaded gallery images: served straight from the shared volume.
    location /uploads/ {
        alias /var/www/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # Backend API (public + admin). The Next.js server also proxies admin calls internally.
    location /api/ {
        proxy_pass http://api_upstream/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /_next/static/ {
        proxy_pass http://web_upstream;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
