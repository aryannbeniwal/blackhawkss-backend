# Temporary HTTP-only config used once by deploy/bootstrap-tls.sh to obtain the first certificate.
server {
    listen 80;
    listen [::]:80;
    server_name blackhawkss.in www.blackhawkss.in;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 200 'Black Hawk Security Solution - setting up TLS'; add_header Content-Type text/plain; }
}
