spring:
  datasource:
    url: jdbc:h2:mem:bhss;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
  mail:
    host: localhost
    port: 2525

app:
  docs:
    enabled: false
  public-base-url: http://localhost:3000
  jwt:
    secret: test-secret-test-secret-test-secret-test-secret
    access-ttl: 15m
    refresh-ttl: 7d
  cors:
    allowed-origins: http://localhost:3000
  mail:
    enabled: false
  uploads:
    dir: ./build/test-uploads
  admin:
    seed-email: admin@test.local
    seed-password: test-password-123
  reminders:
    enabled: false
